input_datetime:
  orario_pt_1:
    has_date: false
    has_time: true
  orario_pt_2:
    has_date: false
    has_time: true
  orario_pt_3:
    has_date: false
    has_time: true
  orario_pt_4:
    has_date: false
    has_time: true
  orario_pt_5:
    has_date: false
    has_time: true
  orario_psi_1:
    has_date: false
    has_time: true  
  orario_psi_2:
    has_date: false
    has_time: true 
  orario_psi_3:
    has_date: false
    has_time: true  
  orario_psi_4:
    has_date: false
    has_time: true  
  orario_psi_5:
    has_date: false
    has_time: true  

input_boolean:
  crono_pt:
    initial: 'on'
  crono_psi:
    initial: 'on'
  zona_notte_partecipa_estate_pt:
    initial: 'on'
  zona_notte_partecipa_estate_psi:
    initial: 'on'

automation:
  - id: 'accensione auto comfort pt 1'
    alias: accensione auto comfort pt 1
    description: ''
    trigger:
      platform: time
      at: input_datetime.orario_pt_1
    condition:
      condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.crono_pt
        state: 'on'
      - condition: state
        entity_id: input_boolean.termoregolazioneautopt
        state: 'on'
      - condition: state
        entity_id: input_select.modalita_pt_1
        state: 'comfort'
    action:
    - choose:
      - conditions:
        - condition: and
          conditions:
            - condition: state
              entity_id: switch.inverno_estate
              state: 'off'
            - condition: state
              entity_id: input_boolean.zona_notte_partecipa_estate_pt
              state: 'off'
        sequence:
          - action: climate.set_preset_mode
            data:
              preset_mode: comfort
            entity_id:
              - climate.salotto
              - climate.sala_da_pranzo
      - conditions:
        - condition: and
          conditions:
            - condition: state
              entity_id: switch.inverno_estate
              state: 'off'
            - condition: state
              entity_id: input_boolean.zona_notte_partecipa_estate_pt
              state: 'on'    
        sequence:
          - action: climate.set_preset_mode
            data:
              preset_mode: comfort
            entity_id: group.climapt_estate
      - conditions:
        - condition: state
          entity_id: switch.inverno_estate
          state: 'on'
        sequence:
          - action: climate.set_preset_mode
            data:
              preset_mode: comfort
            entity_id: group.climapt
    mode: single

