homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Cronotermostato'
        version: '0.1'
        author: 'Vito Ammirata'
        reference: 'www.hassiohelp.eu'
        
      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

#Entità termostato. 

